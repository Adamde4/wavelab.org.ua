<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сторінку не знайдено | Wave</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
<link rel="alternate icon" href="/assets/favicon.ico">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  .notfound {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px var(--gutter);
  }
  .notfound span { font-family: var(--f-mono); color: var(--wave); letter-spacing: .1em; }
  .notfound h1 { font-size: clamp(48px, 10vw, 110px); margin: 16px 0; }
  .notfound p { color: var(--foam-dim); margin-bottom: 30px; }
</style>
</head>
<body>
  <div class="notfound">
    <span>ПОМИЛКА 404</span>
    <h1>Сторінку не знайдено</h1>
    <p>Можливо, вона переїхала або більше не існує.</p>
    <a class="btn btn-primary" href="/"><span>На головну</span></a>
